[project]
name = "soriham-api"
version = "0.1.0"
description = "소리함 백엔드: 녹음 인제스트, 변환 파이프라인 워커, 검색·재생 REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19",
    "fastapi>=0.141",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52",
    "watchdog>=6.0",
]

[project.scripts]
soriham-api = "soriham_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "soriham_api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# alembic 자동 생성 리비전은 생성기 서식을 유지한다
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
