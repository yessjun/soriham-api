services:
  postgres:
    # digest로 고정한다. 가변 태그는 언젠가 다른 이미지를 가리키고, 그때 무엇이
    # 바뀌었는지 알 방법이 없다. 올릴 때는 태그를 확인하고 digest를 다시 적는다
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: soriham
      POSTGRES_USER: soriham
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18+ 이미지는 메이저 버전별 하위 폴더를 쓰므로 상위 경로에 마운트
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soriham -d soriham"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
